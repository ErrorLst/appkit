# svcd 默认配置示例：由插件启动器读取后交给 appkit::config 解析。
# 模块本身不做文件 IO；读取文件与字符编码处理由调用方负责。

[server]
# 监听地址与端口；addr 由两者拼接而成
listen = 0.0.0.0
port = 8080
addr = ${listen}:${port}
workers = 4

[paths]
root = /opt/svcd
data = ${root}/data
log = ${root}/log
plugins = ${root}/plugins

[log]
level = info
file = ${paths.log}/svcd.log
rotate = daily

[plugin]
dir = ${paths.plugins}
autoload = true
timeout_ms = 5000
